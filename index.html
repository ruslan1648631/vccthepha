           ============================================================ */

        /* ============================================================
           MODAL (Base)
           ============================================================ */
        .modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, .5);
    display: none;
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 1000;  /* ✅ ลดจาก 2000 มา 1000 */
    opacity: 1;
    visibility: visible;
    transition: opacity 0.3s ease, visibility 0.3s ease;
}

.modal:not(.active) {
    display: none;
    opacity: 0;
    visibility: hidden;
}

.modal.active {
    display: flex;
    opacity: 1;
    visibility: visible;
}
        
        .modal-content {
            background: #fff;
            border-radius: 18px;
            width: 100%;
            max-width: 520px;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalIn .25s ease;
        }
        
        @keyframes modalIn {
            from {
                transform: scale(.9);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
        
        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;

    <script>
    // ============================================================
    // CONFIGURATION
    // ============================================================
    const APP = {

        currentPage: 'dashboard',
        charts: {},
        selectedFiles: [],
        vaccineCatalog: [],
        leafletMap: null,
        mapMarkers: [],
        villageColors: {},

        missingAllRecords: [],
        villagesCache: [],
        rptCharts: {},
        rptAllRecords: [],
        rptHeaders: [],
        officerSelectedFiles: [],
        officerCurrentChild: null,
        dashboardVillageData: [],
        dashboardVillageColors: {},
        facilityMap: {}
    };

    // ============================================================
    // UTILITY FUNCTIONS
    // ============================================================

    function showLoading(msg) {
        const el = document.getElementById('loadingOverlay');
        if (el) {
            el.style.display = 'flex';
            const t = el.querySelector('.loading-text');
            if (t) t.textContent = msg || 'กำลังโหลด...';
        }
    }

    function hideLoading() {
        const el = document.getElementById('loadingOverlay');
        if (el) el.style.display = 'none';
    }

    function esc(text) {
        if (text === null || text === undefined) return '';
        const d = document.createElement('div');
        d.textContent = String(text);
        return d.innerHTML;
    }

    function formatDate(val) {
        if (!val) return '-';
        const d = new Date(val);
        if (!isNaN(d.getTime())) {
            // กำหนดให้ day เป็น '2-digit' เพื่อบังคับเติม 0
            return d.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: '2-digit' });
        }
        return val.toString();
    }

    function formatThaiDateShort(dateVal) {
        if (!dateVal) return '-';
        const d = new Date(dateVal);
        if (isNaN(d.getTime())) return dateVal.toString();
        const thaiMonths = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
        // เติม 0 ด้านหน้า
        const day = String(d.getDate()).padStart(2, '0');
        return day + ' ' + thaiMonths[d.getMonth()] + ' ' + (d.getFullYear() + 543);
    }

    function formatDateTime(val) {
        if (!val) return '-';
        const d = new Date(val);
        if (!isNaN(d.getTime())) {
            return d.toLocaleString('th-TH', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }
        return val;
    }

    function parseAgeToMonths(ageStr) {
        if (!ageStr) return 0;
        if (ageStr.includes('ไม่ถึง 1 เดือน') || ageStr.includes('แรกเกิด')) return 0.5;
        let m = 0;
        const yMatch = ageStr.match(/(\d+)\s*ปี/);
        const mMatch = ageStr.match(/(\d+)\s*เดือน/);
        if (yMatch) m += parseInt(yMatch[1]) * 12;
        if (mMatch) m += parseInt(mMatch[1]);
        return m;
    }

    function findColumnIndex(headers, possibleNames, defaultIdx = -1) {
        for (let name of possibleNames) {
            const idx = headers.findIndex(h => h && h.toString().toLowerCase() === name.toLowerCase());
            if (idx >= 0) return idx;
        }
        return defaultIdx;
    }

    function getStatusClass(status) {
        if (status === 'ตามนัดปกติ') return 'status-ontime';
        if (status === 'ขาดนัด') return 'status-missed';
        if (status === 'ปฏิเสธวัคซีน') return 'status-refused';
        if (status === 'ครบตามเกณฑ์') return 'status-complete';
        return 'status-pending';
    }

    function getRoleClass(role) {
        if (role === 'Admin' || role === 'Admin_Ampur' || role === 'Admin_HOS') return 'role-admin';
        if (role === 'เจ้าหน้าที่') return 'role-officer';
        return 'role-vhv';
    }

    function statCard(color, icon, label, num, unit) {
        return '<div class="stat-card ' + color + '">' +
            '<div class="stat-info"><h3>' + label + '</h3><div class="number">' + num + '</div><div class="sub">' +
            unit + '</div></div>' +
            '<div class="stat-icon ' + color + '"><i class="' + icon + '"></i></div>' +
            '</div>';
    }

    // ============================================================
    // FILE HELPERS
    // ============================================================

    function readFileAsArrayBuffer(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => resolve(e.target.result);
            reader.onerror = (e) => reject(new Error('ไม่สามารถอ่านไฟล์ได้'));
            reader.readAsArrayBuffer(file);
        });
    }

    async function readExcelData(arrayBuffer) {
        try {
            const workbook = XLSX.read(arrayBuffer, { type: 'array' });
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            const rawRows = XLSX.utils.sheet_to_json(worksheet, { header: 1, raw: false, defval: '' });
            return rawRows.map(row => row.map(cell => String(cell).trim()));
        } catch (error) {
            throw new Error('ไม่สามารถอ่านข้อมูลจากไฟล์ได้: ' + error.message);
        }
    }

    // ============================================================
    // เปลี่ยนมาใช้ FETCH API สำหรับคุยกับ GOOGLE APPS SCRIPT
    // ============================================================
    
    // ⚠️ นำ Web App URL ที่เพิ่งคัดลอกมาเมื่อกี้ มาวางที่นี่
    const API_URL = "https://script.google.com/macros/s/AKfycbxnfkOH9Pexn1K0YXwzIze9_gfWpjBqZ17Rj24Eosa6xykLqkBHxAW_ZTlSVQoO9MZ9/exec";

    async function callGAS(fnName, args) {
        return new Promise(async function(resolve, reject) {
            try {
                // ส่งคำสั่งผ่าน HTTP POST ไปยัง Google Apps Script
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8' // ป้องกันปัญหา CORS
                    },
                    body: JSON.stringify({
                        action: fnName,
                        args: args || []
                    }),
                    redirect: 'follow'
                });

                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const result = await response.json();
                resolve(result);

            } catch (error) {
                console.error("API Call Error:", error);
                reject(error);
            }
        });
    }

    async function doLogin() {
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value;
        const errorEl = document.getElementById('loginError');
        errorEl.textContent = '';

        if (!username || !password) {
            errorEl.textContent = 'กรุณากรอกชื่อผู้ใช้และรหัสผ่าน';
            return;
        }

        showLoading('กำลังเข้าสู่ระบบ...');
        try {
            const result = await callGAS('login', [username, password]);
            hideLoading();
            if (result.success) {
                APP.currentUser = result;
                showMainApp();
            } else {
                errorEl.textContent = result.message || 'เข้าสู่ระบบไม่สำเร็จ';
            }
        } catch (err) {
            hideLoading();
            errorEl.textContent = 'เกิดข้อผิดพลาด: ' + (err.message || err.toString());
        }
    }

    function renderFacilityCoverageChart(coverageData) {
        const ctx = document.getElementById('facilityCoverageChart');
        if (!ctx) return;
        if (APP.charts.facilityCoverage) { 
            APP.charts.facilityCoverage.destroy(); 
            delete APP.charts.facilityCoverage; 
        }

        if (!coverageData || coverageData.length === 0) {
            ctx.parentElement.innerHTML = '<div style="text-align:center;color:#aaa;padding:40px">ยังไม่มีข้อมูลสถานพยาบาล</div>';
            return;
        }

        const labels = coverageData.map(d => d.name);
        const rates = coverageData.map(d => d.rate);
        const onTime = coverageData.map(d => d.onTime);
        const totals = coverageData.map(d => d.total);

        APP.charts.facilityCoverage = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'ความครอบคลุม (%)',
                    data: rates,
                    backgroundColor: rates.map(r => r < 80 ? '#ea5455' : (r < 90 ? '#ff9f43' : '#28c76f')),
                    borderRadius: 4,
                    hoverBackgroundColor: '#667eea'
                }]
            },
            options: {
                indexAxis: 'y',
                responsive: true,
                maintainAspectRatio: false,
                onClick: function(event, elements) {
                    if (elements && elements.length > 0) {
                        const dataIndex = elements[0].index;
                        const clickedHcode = coverageData[dataIndex].code;
                        const clickedName = coverageData[dataIndex].name;
                        filterVillageChartByFacility(clickedHcode, clickedName);
                    }
                },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                const idx = context.dataIndex;
                                return `ความครอบคลุม: ${rates[idx]}% (รับแล้ว ${onTime[idx]}/${totals[idx]} คน) - คลิกเพื่อดูหมู่บ้าน`;
                            }
                        }
                    }
                },
                scales: {
                    x: { max: 100, beginAtZero: true, ticks: { font: { family: 'Kanit' } } },
                    y: { ticks: { font: { family: 'Kanit', size: 12 } } }
                }
            }
        });
        
        ctx.onmousemove = function(evt) {
            const points = APP.charts.facilityCoverage.getElementsAtEventForMode(evt, 'nearest', { intersect: true }, true);
            if (points.length) {
                ctx.style.cursor = 'pointer';
            } else {
                ctx.style.cursor = 'default';
            }
        };
    }

    function renderStatusChart(data) {
        const ctx = document.getElementById('statusChart');
        if (!ctx) return;
        if (APP.charts.status) { APP.charts.status.destroy(); delete APP.charts.status; }

        const total = data.total || ((data.onTime || 0) + (data.missed || 0) + (data.refused || 0));

        APP.charts.status = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['มาตามนัดปกติ', 'ขาดนัด', 'ปฏิเสธวัคซีน'],
                datasets: [{
                    data: [data.onTime || 0, data.missed || 0, data.refused || 0],
                    backgroundColor: ['#28c76f', '#ff9f43', '#ea5455'],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: { position: 'bottom', labels: { font: { family: 'Kanit', size: 12 } } },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                const label = context.label || '';
                                const value = context.raw || 0;
                                const percentage = total > 0 ? Math.round((value / total) * 100) : 0;
                                return label + ': ' + value + ' คน (' + percentage + '%)';
                            }
                        }
                    }
                }
            }
        });
    }

    function renderVillageVerticalBar(data, villageColorsMap) {
        const container = document.getElementById('villageBarChartVertical');
        if (!container) return;

        if (!data || !Array.isArray(data) || data.length === 0) {
            container.innerHTML = '<div style="text-align:center;color:#aaa;padding:20px">ยังไม่มีข้อมูล</div>';
            return;
        }

        const sortedData = [...data].sort(function(a, b) { return (b.rate || 0) - (a.rate || 0); });

        container.innerHTML = sortedData.map(function(d) {
            const rate = d.rate || 0;
            const barColor = rate < 80 ? '#ef4444' : ((villageColorsMap && villageColorsMap[d.village]) || '#667eea');
            const barHeight = Math.max(rate, 5);
            const total = d.total || 0;
            const vaccinatedCount = d.vaccinatedCount || d.onTime || 0;

            return '<div class="bar-wrapper">' +
                '<div class="bar-bg-vertical" style="height:200px">' +
                '<div class="bar-fill-vertical" style="height:' + barHeight + '%; background:' + barColor + '"></div>' +
                '</div>' +
                '<div class="bar-label">' + esc(d.village) + '</div>' +
                '<div class="bar-value">' + vaccinatedCount + '/' + total + ' <span class="bar-percent">(' + rate + '%)</span></div>' +
                '</div>';
        }).join('');
    }

    async function initLeafletMap(forceHcode) {
        if (typeof L === 'undefined') {
            setTimeout(() => initLeafletMap(forceHcode), 500);
            return;
        }

        try {
            const facilityFilterEl = document.getElementById('mapFacilityFilter');
            if (forceHcode !== undefined && facilityFilterEl) {
                facilityFilterEl.value = forceHcode;
            }
            
            const selectedFacility = facilityFilterEl ? facilityFilterEl.value : 'ทั้งหมด';

            const filters = {
    village: (APP.currentUser.role !== 'Admin' && APP.currentUser.village !== '-') ? APP.currentUser.village : 'ทั้งหมด',
    userRole: APP.currentUser.role,      
    userHcode: APP.currentUser.hcode,    
    userSubdistrict: APP.currentUser.subdistrict,
    userVillage: APP.currentUser.village, 
    hcode: selectedFacility 
};
const childrenResult = await callGAS('getAllChildrenForMap', [filters]);

            const mapDiv = document.getElementById('childMap');
            if (!mapDiv) return;

            if (!childrenResult.success || !childrenResult.children) {
                const errorMsg = childrenResult.message ? `<br><small style="color: #dc3545;">(ข้อผิดพลาด: ${esc(childrenResult.message)})</small>` : '';
                mapDiv.innerHTML = '<div style="padding:20px;text-align:center;color:#aaa;">ไม่พบข้อมูลเด็ก' + errorMsg + '</div>';
                return;
            }

            const hasAnyCoords = childrenResult.children.some(function(child) {
                return child.lat && child.lng && !isNaN(parseFloat(child.lat)) && !isNaN(parseFloat(child.lng));
            });

            if (!hasAnyCoords) {
                mapDiv.innerHTML = '<div style="padding:20px;text-align:center;color:#aaa;">ไม่พบเด็กที่มีพิกัดในระบบ (ในสถานพยาบาลที่เลือก)</div>';
                return;
            }

            if (APP.leafletMap) {
                APP.leafletMap.remove();
                APP.leafletMap = null;
            }

            APP.leafletMap = L.map('childMap').setView([13.736717, 100.523186], 10);

            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
                subdomains: 'abcd',
                maxZoom: 19,
                minZoom: 6
            }).addTo(APP.leafletMap);

            if (APP.mapMarkers && APP.mapMarkers.length) {
                APP.mapMarkers.forEach(function(m) {
                    if (APP.leafletMap && m) APP.leafletMap.removeLayer(m);
                });
            }
            APP.mapMarkers = [];

            const bounds = L.latLngBounds();
            let hasValidCoords = false;

            const statusColors = {
                'ตามนัดปกติ': '#28c76f',
                'ตามนัด': '#28c76f',
                'ปกติ': '#28c76f',
                'ขาดนัด': '#ff9f43',
                'ขาด': '#ff9f43',
                'ปฏิเสธวัคซีน': '#ea5455',
                'ปฏิเสธ': '#ea5455',
                'ครบตามเกณฑ์': '#667eea',
                'ครบ': '#667eea'
            };

            const statusFilterEl = document.getElementById('mapStatusFilter');
            const selectedStatus = statusFilterEl ? statusFilterEl.value : 'ทั้งหมด';

            let countDisplayed = 0;

            for (let i = 0; i < childrenResult.children.length; i++) {
                const child = childrenResult.children[i];
                const status = child.status || 'ไม่ระบุ';

                if (selectedStatus !== 'ทั้งหมด' && status !== selectedStatus) continue;

                const lat = child.lat;
                const lng = child.lng;

                if (lat && lng && !isNaN(parseFloat(lat)) && !isNaN(parseFloat(lng))) {
                    hasValidCoords = true;
                    const color = statusColors[status] || '#6c757d';
                    const latNum = parseFloat(lat);
                    const lngNum = parseFloat(lng);

                    const popupContent = createPopupContent(child);

                    const circleMarker = L.circleMarker([latNum, lngNum], {
                        radius: 12,
                        fillColor: color,
                        color: '#ffffff',
                        weight: 3,
                        opacity: 1,
                        fillOpacity: 0.85
                    }).addTo(APP.leafletMap);

                    circleMarker.bindPopup(popupContent, { maxWidth: 350, minWidth: 260 });

                    APP.mapMarkers.push(circleMarker);
                    bounds.extend([latNum, lngNum]);
                    countDisplayed++;
                }
            }

            if (countDisplayed === 0) {
                mapDiv.innerHTML = '<div style="padding:20px;text-align:center;color:#ff9f43;">ไม่พบข้อมูลเด็กที่มีพิกัดตามเงื่อนไขที่เลือก</div>';
                return;
            }

            if (hasValidCoords && countDisplayed > 0) {
                APP.leafletMap.fitBounds(bounds, { padding: [50, 50] });
                if (countDisplayed === 1) {
                    APP.leafletMap.setZoom(16);
                }
            }

            if (window.mapLegend) {
                APP.leafletMap.removeControl(window.mapLegend);
            }

            window.mapLegend = L.control({ position: 'bottomright' });
            window.mapLegend.onAdd = function(map) {
                const div = L.DomUtil.create('div', 'info legend');
                div.style.backgroundColor = 'white';
                div.style.padding = '10px 14px';
                div.style.borderRadius = '8px';
                div.style.boxShadow = '0 2px 8px rgba(0,0,0,0.15)';
                div.style.fontFamily = 'Kanit, sans-serif';
                div.style.fontSize = '12px';
                div.innerHTML =
                    '<strong style="display:block; margin-bottom:8px;"><i class="fas fa-map-pin"></i> สถานะวัคซีน</strong>' +
                    '<div><span style="display:inline-block; width:14px; height:14px; background:#28c76f; border-radius:50%; margin-right:8px;"></span> ตามนัดปกติ</div>' +
                    '<div style="margin-top:5px;"><span style="display:inline-block; width:14px; height:14px; background:#ff9f43; border-radius:50%; margin-right:8px;"></span> ขาดนัด</div>' +
                    '<div style="margin-top:5px;"><span style="display:inline-block; width:14px; height:14px; background:#ea5455; border-radius:50%; margin-right:8px;"></span> ปฏิเสธวัคซีน</div>' +
                    '<div style="margin-top:5px;"><span style="display:inline-block; width:14px; height:14px; background:#667eea; border-radius:50%; margin-right:8px;"></span> ครบตามเกณฑ์</div>' +
                    '<div style="margin-top:8px; border-top:1px solid #eee; padding-top:8px; text-align:center; color:#666; font-size:11px;">' +
                    'จำนวน: ' + countDisplayed + ' ราย' +
                    '</div>';
                return div;
            };
            window.mapLegend.addTo(APP.leafletMap);
            setTimeout(function() {
                if (APP.leafletMap) {
                    APP.leafletMap.invalidateSize();
                }
            }, 300);

        } catch (e) {
            console.error('Map error:', e);
            const mapDiv2 = document.getElementById('childMap');
            if (mapDiv2) mapDiv2.innerHTML = '<div style="padding:20px;text-align:center;color:#dc3545">ไม่สามารถโหลดแผนที่ได้: ' + esc(e.message) + '</div>';
        }
    }

        const missingVaccines = child.missingVaccines || '';

            'ขาดนัด': '#ff9f43',

        } [status] || '#6c757d';

        return '<div style="font-family:Kanit; font-size:13px; min-width:260px; max-width:320px;">' +

            '<p style="margin:0;"><strong>CID:</strong> ' + esc(id) + '</p>' +

            esc(village) + '</p>' +
            phoneHtml +
            '<p style="margin:0;"><strong>บิดา:</strong> ' + esc(fatherName) + '</p>' +
            '<p style="margin:0;"><strong>มารดา:</strong> ' + esc(motherName) + '</p>' +

    window.viewChildFromMap = async function(childId) {
        showLoading('กำลังโหลดข้อมูล...');
        try {
            const result = await callGAS('getChildDetail', [childId]);
            hideLoading();
            if (!result.success) return Swal.fire('ผิดพลาด', result.message, 'error');
            const c = result.child;
            showChildDetail(c);
        } catch (e) {
            hideLoading();
            Swal.fire('ผิดพลาด', e.message, 'error');
        }
    };

    function showChildDetail(c) {
        const vaccineRows = (c.vaccines || []).map(function(vacData) {
            const sourceBadge = vacData.source === 'รายงานติดตาม' ?
                '<span style="font-size:10px; background:#dcfce7; color:#059669; padding:2px 6px; border-radius:4px; margin-left:8px;">ติดตาม</span>' :
                '<span style="font-size:10px; background:#e0f2fe; color:#0284c7; padding:2px 6px; border-radius:4px; margin-left:8px;">ข้อมูลฐาน</span>';

            const dateDisplay = vacData.date && vacData.date !== '-' ? formatThaiDateShort(vacData.date) : vacData.date || '-';

            return '<tr style="border-bottom: 1px solid #f1f5f9;">' +
                '<td style="padding:8px 4px; font-weight:500; color:#334155;">' + esc(vacData.name) + sourceBadge +
                '</td>' +
                '<td style="padding:8px 4px; color:#28c76f; text-align:right;">' + esc(dateDisplay) + '</td>' +
                '</tr>';
        });

        const phoneHtml = c.phone && c.phone !== '-' && c.phone !== '' ?
            '<a href="tel:' + esc(c.phone) + '" class="phone-link"><i class="fas fa-phone-alt"></i> ' + esc(c.phone) + '</a>' : '-';

        let gpsHtml = '-';
        if (c.gps && c.gps.includes(',')) {
            const coords = c.gps.split(',');

            const lng = parseFloat(coords[1]);

                '<div><small style="color:#64748b; font-size:12px;">วันเกิด</small><div style="font-weight:500;">' + formatDate(c.birthDate) + '</div></div>' +
                '<div><small style="color:#64748b; font-size:12px;">อายุ</small><div style="font-weight:500;">' + esc(c.age) + '</div></div>' +
                '<div style="grid-column:1/-1"><small style="color:#64748b; font-size:12px;">ที่อยู่</small><div style="font-weight:500;">บ้าน ' + esc(c.houseNumber) + ' หมู่ ' + esc(c.village) + '</div></div>' +
                '<div><small style="color:#64748b; font-size:12px;">โทรศัพท์</small><div style="font-weight:500;">' + phoneHtml + '</div></div>' +
                '<div><small style="color:#64748b; font-size:12px;">พิกัด GPS</small><div style="font-weight:500;">' + gpsHtml + '</div></div>' +
                '<div><small style="color:#64748b; font-size:12px;">อสม.ประจำ</small><div style="font-weight:500;">' + esc(c.asm || '-') + '</div></div>' +
                '<div><small style="color:#64748b; font-size:12px;">บิดา</small><div style="font-weight:500;">' + esc(c.fatherName || '-') + '</div></div>' +
                '<div><small style="color:#64748b; font-size:12px;">มารดา</small><div style="font-weight:500;">' + esc(c.motherName || '-') + '</div></div>' +
                '</div>' +
                '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">' +
                '<strong style="font-size:15px; color:#0f172a;"><i class="fas fa-syringe" style="color:#667eea;"></i> ประวัติการรับวัคซีนทั้งหมด</strong>' +
                '<span style="font-size:12px; color:#64748b;">รวม ' + vaccineRows.length + ' รายการ</span>' +

        try {
            const result = await callGAS('getUsers', [APP.currentUser.role, APP.currentUser.hcode]);

            const users = result.success ? result.users : [];

            page.innerHTML =
                '<div class="page-title"><i class="fas fa-users-cog"></i> จัดการผู้ใช้งาน</div>' +

                    else statusDisplay = '<span class="status-badge status-refused">ระงับ</span>';

                    // เงื่อนไขสิทธิ์การแสดงปุ่มอนุมัติ
                    let canApprove = false;
                    if (u.status === 'register') {
                        if (APP.currentUser.role === 'Admin_Ampur') canApprove = true;
                        if (APP.currentUser.role === 'Admin_HOS' && u.hcode === APP.currentUser.hcode) canApprove = true;
                    }
                    
                    let approveBtn = canApprove ? `<button class="action-btn" style="color:#28c76f;" title="อนุมัติการใช้งาน" onclick="approveUser('${esc(u.username)}')"><i class="fas fa-user-check"></i></button>` : '';

                    return '<tr>' +
                        '<td><span style="color:#667eea; font-weight:500;">' + esc(u.hcode) + '</span></td>' +
                        '<td>' + esc(u.username) + '</td>' +
                        '<td>' + esc(u.fullname) + '</td>' +
                        '<td><span class="role-badge ' + getRoleClass(u.role) + '">' + esc(u.role) + '</span></td>' +
                        '<td>' + esc(u.village) + '</td>' +
                        '<td><span style="color:#10b981; font-weight:500;">' + esc(u.subdistrict) + '</span></td>' +
                        '<td>' + statusDisplay + '</td>' +
                        '<td style="white-space:nowrap;">' + approveBtn +
                        '<button class="action-btn edit" title="แก้ไข" onclick="editUser(\'' + esc(u.username) + '\')"><i class="fas fa-edit"></i></button>' +
                        (u.username !== 'admin' ? '<button class="action-btn delete" title="ลบ" onclick="confirmDeleteUser(\'' + esc(u.username) + '\')"><i class="fas fa-trash"></i></button>' : '') +

    function ensureUserModal() {
        if (document.getElementById('userModal')) return;
        document.body.insertAdjacentHTML('beforeend',
            '<div id="userModal" class="modal">' +
            '<div class="modal-content">' +
            '<div class="modal-header"><h3 id="userModalTitle">เพิ่มผู้ใช้งาน</h3><button class="modal-close" onclick="closeUserModal()">×</button></div>' +
            '<div class="modal-body">' +

    window.updateVillageDropdowns = async function() {
        const hcode = document.getElementById('um_hcode').value;
        const subSelect = document.getElementById('um_subdistrict');
        const vilSelect = document.getElementById('um_village');
        
        subSelect.innerHTML = '<option value="">-- โหลดข้อมูล... --</option>';
        vilSelect.innerHTML = '<option value="">-- โหลดข้อมูล... --</option>';
        
        if (!hcode) {
            subSelect.innerHTML = '<option value="">-- เลือกตำบล --</option>';
            vilSelect.innerHTML = '<option value="">-- เลือกหมู่ที่ --</option>';
            return;
        }
        
        try {
            // ดึงข้อมูลหมู่บ้านทั้งหมด (เก็บไว้ใน Cache เพื่อไม่ให้โหลดซ้ำบ่อย)
            if (!APP.allVillagesCache) {
                const res = await callGAS('getVillages', []);
                if (res.success) APP.allVillagesCache = res.villages;
                else APP.allVillagesCache = [];
            }
            
            // กรองหาหมู่บ้านและตำบลที่ตรงกับ hcode
            const filtered = APP.allVillagesCache.filter(v => v.hcode === hcode);
            APP.currentHcodeVillages = filtered;
            
            const subs = [...new Set(filtered.map(v => v.subdistrict).filter(Boolean))];
            subSelect.innerHTML = '<option value="">-- เลือกตำบล --</option>' + 
                subs.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
            
            const vils = [...new Set(filtered.map(v => v.village_no).filter(Boolean))].sort((a,b)=>parseInt(a)-parseInt(b));
            vilSelect.innerHTML = '<option value="">-- เลือกหมู่ที่ --</option>' + 
                vils.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
                
        } catch(e) {
            console.error(e);
            subSelect.innerHTML = '<option value="">-- เลือกตำบล --</option>';
            vilSelect.innerHTML = '<option value="">-- เลือกหมู่ที่ --</option>';
        }
    };

    window.filterVillagesBySub = function() {
        const sub = document.getElementById('um_subdistrict').value;
        const vilSelect = document.getElementById('um_village');
        let filtered = APP.currentHcodeVillages || [];
        
        if (sub) {
            filtered = filtered.filter(v => v.subdistrict === sub);
        }
        
        const vils = [...new Set(filtered.map(v => v.village_no).filter(Boolean))].sort((a,b)=>parseInt(a)-parseInt(b));
        vilSelect.innerHTML = '<option value="">-- เลือกหมู่ที่ --</option>' + 
            vils.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
    };

    window.editUser = async function(username) {
        try {
            showLoading('กำลังโหลดข้อมูล...');
            const result = await callGAS('getUsers', []);
            const u = result.users.find(function(x) { return x.username === username; });
            hideLoading();
            
            if (!u) return Swal.fire('ผิดพลาด', 'ไม่พบผู้ใช้งาน', 'error');
            ensureUserModal();
            
            document.getElementById('userModalTitle').textContent = 'แก้ไขผู้ใช้งาน';
            document.getElementById('userModalMode').value = 'edit';
            document.getElementById('userModalOriginal').value = username;
            document.getElementById('um_username').value = u.username;
            document.getElementById('um_username').disabled = true;
            document.getElementById('um_password').value = u.password;
            document.getElementById('um_fullname').value = u.fullname;
            document.getElementById('um_role').value = u.role;
            
            document.getElementById('um_hcode').value = u.hcode === '-' ? '' : u.hcode;
            await window.updateVillageDropdowns(); 
            
            document.getElementById('um_subdistrict').value = u.subdistrict === '-' ? '' : u.subdistrict;
            window.filterVillagesBySub();
            document.getElementById('um_village').value = u.village === '-' ? '' : u.village;
            
            // แสดงหน้าต่างตั้งค่า Status
            if (APP.currentUser && (APP.currentUser.role === 'Admin_Ampur' || APP.currentUser.role === 'Admin_HOS')) {
                document.getElementById('um_status_group').style.display = 'block';
                document.getElementById('um_status').value = u.status || 'active';
            }
            
            document.getElementById('userModal').classList.add('active');
        } catch (e) { hideLoading(); Swal.fire('ผิดพลาด', e.message, 'error'); }
    };

    window.saveUser = async function() {
        const mode = document.getElementById('userModalMode').value;
        const orig = document.getElementById('userModalOriginal').value;
        
        let userStatus = 'register';
        if (document.getElementById('um_status_group').style.display !== 'none') {
             userStatus = document.getElementById('um_status').value;
        }

        const data = {
            hcode: document.getElementById('um_hcode').value.trim(),
            username: document.getElementById('um_username').value.trim(),
            password: document.getElementById('um_password').value,
            fullname: document.getElementById('um_fullname').value.trim(),
            role: document.getElementById('um_role').value,
            village: document.getElementById('um_village').value.trim() || '-',
            subdistrict: document.getElementById('um_subdistrict').value.trim() || '-',
            status: userStatus
        };

        showLoading('กำลังบันทึก...');
        try {
            const result = mode === 'edit' ?
                await callGAS('updateUser', [orig, data]) :
                await callGAS('addUser', [data]);

            hideLoading();
            if (result.success) {
                closeUserModal();
                if (APP.currentUser) {
                    Swal.fire({ icon: 'success', title: 'สำเร็จ', text: result.message, timer: 1500, showConfirmButton: false });
                    setTimeout(loadUsersPage, 500);
                } else {
                    Swal.fire({ icon: 'success', title: 'สมัครใช้งานสำเร็จ', text: 'กรุณารอแอดมินตรวจสอบและอนุมัติ (Active) ก่อนเข้าใช้งาน', confirmButtonText: 'ตกลง' });
                }
            } else {
                Swal.fire('ผิดพลาด', result.message, 'error');
            }
        } catch (e) { hideLoading(); Swal.fire('ผิดพลาด', e.message, 'error'); }
    };

    function exportMissingCsv() {
        if (!APP.missingAllRecords || APP.missingAllRecords.length === 0) {
            return Swal.fire('แจ้งเตือน', 'ไม่มีข้อมูลสำหรับส่งออก', 'info');
        }

        const rows = [];
        rows.push(['HN', 'ชื่อ-สกุล', 'วันเกิด', 'อายุ', 'บ้านเลขที่', 'หมู่ที่', 'อสม. ผู้รับผิดชอบ', 'สถานะ', 'วัคซีนที่ขาด']);

        APP.missingAllRecords.forEach(function(c) {
            rows.push([
                c.hn || '',
                c.fullname || '',
                formatDate(c.birthDate) || '',
                c.age || '',
                c.houseNumber || '',
                c.village || '',
                c.asm || '',
                c.status || '',
                c.missingVaccines || ''
            ]);
        });

        const csv = rows.map(function(row) {
            return row.map(function(cell) {
                const s = String(cell || '').replace(/"/g, '""');
                return (s.includes(',') || s.includes('"') || s.includes('\n')) ? '"' + s + '"' : s;
            }).join(',');
        }).join('\r\n');

        const bom = '\uFEFF';
        const blob = new Blob([bom + csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = url;
        a.download = 'Missing_Children_' + new Date().toISOString().slice(0, 10) + '.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    async function doLoadAppointments() {
        showLoading('กำลังโหลดข้อมูลนัดหมาย...');
        const filterDate = document.getElementById('apptDateFilter') ? document.getElementById('apptDateFilter').value : '';
        const facilityFilter = document.getElementById('apptFacilityFilter') ? document.getElementById('apptFacilityFilter').value : 'ทั้งหมด';
        let thaiFilterDate = '';
        if (filterDate) {
            const d = new Date(filterDate);
            if (!isNaN(d.getTime())) {
                const thaiMonths = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
                thaiFilterDate = d.getDate() + ' ' + thaiMonths[d.getMonth()] + ' ' + (d.getFullYear() + 543);
            }
        }
        
        const filters = { userRole: APP.currentUser.role, userHcode: APP.currentUser.hcode, userSubdistrict: APP.currentUser.subdistrict, userVillage: APP.currentUser.village };  
        
        try {
            const result = await callGAS('getAppointments', [filters]);
            hideLoading();

            let headers = result.success && result.headers ? result.headers : [];
            let appts = result.success ? result.appointments : [];

            // กำหนด Index สำหรับระบุคอลัมน์
            const hcodeIdx = findColumnIndex(headers, ['hcode', 'รหัสสถานพยาบาล', 'สถานพยาบาล'], 0);
            const dateColIdx = findColumnIndex(headers, ['วันที่นัด', 'วันนัด', 'วันที่', 'นัดครั้งต่อไป'], 3);
            const hnIdx = findColumnIndex(headers, ['HN', 'รหัส', 'hn']);
            const nameIdx = findColumnIndex(headers, ['ชื่อ-สกุล', 'ชื่อ', 'ChildName', 'fullname']);
            
            // หา Index ของ รหัสวัคซีน เพื่อที่จะนำไปแสดงเป็นป้ายสีสวยๆ
            const vacColIdx = findColumnIndex(headers, ['รหัสวัคซีน', 'วัคซีน', 'vaccine']);

            // ฟังก์ชันตรวจสอบว่าควรซ่อนคอลัมน์นี้หรือไม่ (ID, CID, ชื่อวัคซีน)
            const isHiddenCol = (idx, hName) => {
                const hStr = hName ? hName.toString().trim().toUpperCase() : '';
                return hStr === 'ID' || hStr === 'CID' || hStr === 'ชื่อวัคซีน';
            };

            const isSpecialOfficer = (APP.currentUser.role === 'เจ้าหน้าที่' && (APP.currentUser.hcode === '00860' || APP.currentUser.hcode === '11390'));
            if (APP.currentUser.role !== 'Admin_Ampur' && !isSpecialOfficer && hcodeIdx >= 0) {
                appts = appts.filter(function(a) { return a[hcodeIdx] === APP.currentUser.hcode; });
            }

            if (facilityFilter !== 'ทั้งหมด' && hcodeIdx >= 0) {
                appts = appts.filter(function(a) { return a[hcodeIdx] === facilityFilter; });
            }

            if (thaiFilterDate && dateColIdx >= 0) {
                appts = appts.filter(function(a) { return a[dateColIdx] && a[dateColIdx].toString().trim().includes(thaiFilterDate); });
            }

            APP.apptHeaders = headers;
            APP.apptAllRecords = appts;

            // กรองสร้างส่วนหัวตาราง (ข้ามคอลัมน์ที่ถูกซ่อน)
            const theadHTML = '<tr>' + headers.map(function(h, idx) { 
                if (isHiddenCol(idx, h)) return ''; 
                
                let displayH = h.toString().trim();
                if (displayH === 'hcode' || displayH === 'รหัสสถานพยาบาล') displayH = 'สถานพยาบาล';
                if (displayH === 'รหัสวัคซีน') displayH = 'วัคซีน'; // เปลี่ยนชื่อ Header จาก รหัสวัคซีน เป็น วัคซีน ตอนแสดงผล
                
                return '<th style="white-space: nowrap;">' + esc(displayH) + '</th>'; 
            }).join('') + '</tr>';

            // กรองสร้างส่วนข้อมูลแถวตาราง
            const tbodyHTML = appts.map(function(row) {
                let trHtml = '<tr>';
                for (let idx = 0; idx < headers.length; idx++) {
                    if (isHiddenCol(idx, headers[idx])) continue; 
                    
                    const cell = row[idx] !== undefined ? row[idx] : '';
                    if (idx === hcodeIdx) {
                        const displayName = APP.facilityMap[cell] || cell || '-';
                        trHtml += '<td><span style="color:#667eea; font-weight:500;">' + esc(displayName) + '</span></td>';
                    } else if (idx === vacColIdx && cell) {
                        // แยกชื่อวัคซีนมาใส่กรอบสีๆ (Tag)
                        const vacTags = cell.toString().split(',').map(function(v) {
                            return '<span class="status-badge" style="background:#e3f2fd; color:#0284c7; margin-right:4px; margin-bottom:2px; display:inline-block; border: 1px solid #bae6fd;">' + esc(v.trim()) + '</span>';
                        }).join('');
                        trHtml += '<td>' + vacTags + '</td>';
                    } else {
                        trHtml += '<td>' + esc(cell) + '</td>';
                    }
                }
                trHtml += '</tr>';
                return trHtml;
            }).join('');

            document.getElementById('apptsTableWrap').innerHTML = '<div class="data-table" style="width:100%; overflow:hidden;"><table id="apptsTable" class="display nowrap" style="width:100%;">' +
                '<thead>' + theadHTML + '</thead><tbody>' + tbodyHTML + '</tbody></table></div>';

            initDT('apptsTable', { scrollX: true, autoWidth: false });
        } catch (err) {
            hideLoading();
            document.getElementById('apptsTableWrap').innerHTML = '<div class="error-message">เกิดข้อผิดพลาด: ' + esc(err.message) + '</div>';
        }
    }

    function exportApptCsv() {
        if (!APP.apptAllRecords || APP.apptAllRecords.length === 0) {
            return Swal.fire('แจ้งเตือน', 'ไม่มีข้อมูลสำหรับ export', 'info');
        }
        
        // ฟังก์ชันตรวจสอบว่าควรซ่อนคอลัมน์นี้หรือไม่ (ใช้ตรวจสอบร่วมกับตอนแสดงผล)
        const isHiddenCol = (idx, hName) => {
            const hStr = hName ? hName.toString().trim().toUpperCase() : '';
            return hStr === 'ID' || hStr === 'CID' || hStr === 'ชื่อวัคซีน';
        };

        const rows = [];
        
        // ข้ามการนำ Header ของคอลัมน์ที่ต้องการซ่อน ออกมาแสดงผล
        const exportHeaders = APP.apptHeaders.filter((h, idx) => !isHiddenCol(idx, h));
        rows.push(exportHeaders.map(function(h) { 
            let hName = h ? h.toString().trim() : '';
            if (hName === 'รหัสวัคซีน') hName = 'วัคซีน';
            return hName; 
        }));

        APP.apptAllRecords.forEach(function(r) {
            const rowData = [];
            for (let i = 0; i < APP.apptHeaders.length; i++) {
                // ข้ามการนำข้อมูลของคอลัมน์ที่ต้องการซ่อน ออกมาแสดงผล
                if (isHiddenCol(i, APP.apptHeaders[i])) continue; 
                rowData.push(r[i] !== undefined ? r[i].toString() : '');
            }
            rows.push(rowData);
        });

        const csv = rows.map(function(row) {
            return row.map(function(cell) {
                const s = String(cell || '').replace(/"/g, '""');
                return (s.includes(',') || s.includes('"') || s.includes('\n')) ? '"' + s + '"' : s;
            }).join(',');
        }).join('\r\n');

        const bom = '\uFEFF';
        const blob = new Blob([bom + csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = url;
        a.download = 'Appointments_' + new Date().toISOString().slice(0, 10) + '.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    function renderCalendarEvents() {
        const appts = APP.calendarRawAppts || [];
        const headers = APP.calendarHeaders || [];
        
        const hcodeIdx = headers.findIndex(h => h && (h.toString().toLowerCase() === 'hcode' || h.toString().includes('รหัสสถานพยาบาล')));
        const dateIdx = headers.findIndex(h => h && h.toString().includes('วัน'));
        const nameIdx = headers.findIndex(h => h && h.toString().includes('ชื่อ'));
        const hnIdx = headers.findIndex(h => h && (h.toString().toUpperCase().includes('HN') || h.toString().includes('รหัส')));
        const vacIdx = headers.findIndex(h => h && h.toString().includes('วัคซีน'));

        const facilityFilterEl = document.getElementById('calFacilityFilter');
        const selectedFacility = facilityFilterEl ? facilityFilterEl.value : 'ทั้งหมด';

        let mergedEvents = {};

        appts.forEach(function(a) {
            let hcode = hcodeIdx !== -1 ? a[hcodeIdx] : '';

            const isSpecialOfficer = (APP.currentUser.role === 'เจ้าหน้าที่' && (APP.currentUser.hcode === '00860' || APP.currentUser.hcode === '11390'));
            if (APP.currentUser.role !== 'Admin_Ampur' && !isSpecialOfficer && hcodeIdx !== -1) {
                if (hcode !== APP.currentUser.hcode) return;
            }

            if (selectedFacility !== 'ทั้งหมด' && hcodeIdx !== -1) {
                if (hcode !== selectedFacility) return;
            }

            let dStr = a[dateIdx] ? a[dateIdx].toString().trim() : '';
            if (!dStr || dStr === '-') return;
            
            let isoDate = parseThaiDateToISO(dStr);
            if (!isoDate) return;

            let name = a[nameIdx] ? a[nameIdx].toString().trim() : '';
            let hn = a[hnIdx] ? a[hnIdx].toString().trim() : '';
            let vac = a[vacIdx] ? a[vacIdx].toString().trim() : '';

            let key = isoDate + '_' + hcode;

            if (!mergedEvents[key]) {
                mergedEvents[key] = {
                    isoDate: isoDate,
                    dateStr: dStr,
                    hcode: hcode,
                    children: {} 
                };
            }
            
            let childKey = hn + '_' + name;
            if (childKey !== '_') {
                if (!mergedEvents[key].children[childKey]) {
                    mergedEvents[key].children[childKey] = { hn: hn, name: name, vaccines: [] };
                }
                if (vac && !mergedEvents[key].children[childKey].vaccines.includes(vac)) {
                    mergedEvents[key].children[childKey].vaccines.push(vac);
                }
            }
        });

        const colors = ['#667eea', '#28c76f', '#ff9f43', '#ea5455', '#17a2b8', '#9c27b0', '#e83e8c', '#fd7e14'];

        let events = Object.values(mergedEvents).map(function(item, index) {
            let facilityName = APP.facilityMap && APP.facilityMap[item.hcode] ? APP.facilityMap[item.hcode] : (item.hcode || 'ไม่ระบุสถานพยาบาล');
            let count = Object.keys(item.children).length;
            let childrenList = Object.values(item.children);

            return {
                title: facilityName + ' (' + count + ' คน)',
                start: item.isoDate,
                allDay: true,
                extendedProps: {
                    facilityName: facilityName,
                    dateStr: item.dateStr,
                    count: count,
                    childrenList: childrenList
                },
                backgroundColor: colors[index % colors.length], 
                borderColor: 'transparent'
            };
        });

        const calendarEl = document.getElementById('calendarContainer');
        if (!calendarEl) return;
        
        calendarEl.innerHTML = ''; 

        const canManage = (APP.currentUser.role === 'Admin_Ampur' || APP.currentUser.role === 'Admin_HOS' || APP.currentUser.role === 'เจ้าหน้าที่');
        
        const calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            locale: 'th',
            buttonText: { today: 'วันนี้', month: 'เดือน', week: 'สัปดาห์', day: 'วัน' },
            events: events,
            height: 'auto',
            eventClick: function(info) {
                showCalendarEventDetail(info.event.extendedProps, canManage);
            },
            eventDidMount: function(info) {
                let children = info.event.extendedProps.childrenList;
                
                let tooltipText = "รายชื่อนัดหมาย:\n";
                children.forEach(c => {
                    let vac = c.vaccines.join(', ') || '-';
                    tooltipText += `• ${c.name} (${vac})\n`;
                });
                
                info.el.setAttribute('title', tooltipText);
                info.el.style.cursor = 'pointer';
            }
        });
        calendar.render();
    }

    function parseThaiDateToISO(thaiDateStr) {
        const thaiMonths = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.', 
                            'มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
        let parts = thaiDateStr.split(' ');
        if (parts.length < 3) return null;
        let d = parts[0].padStart(2, '0');
        let mStr = parts[1];
        let y = parseInt(parts[2]);
        let mIdx = thaiMonths.findIndex(tm => tm === mStr);
        if (mIdx === -1) return null;
        let m = (mIdx % 12) + 1;
        if (y > 2400) y -= 543;
        return `${y}-${m.toString().padStart(2, '0')}-${d}`;
    }

    function officerGetGPS() {
        if (!navigator.geolocation) {
            Swal.fire('ไม่รองรับ', 'เบราว์เซอร์ของคุณไม่รองรับการระบุพิกัด', 'error');
            return;
        }

        showLoading('กำลังระบุพิกัด...');
        navigator.geolocation.getCurrentPosition(
            function(pos) {
                hideLoading();
                const coords = pos.coords.latitude.toFixed(6) + ',' + pos.coords.longitude.toFixed(6);
                document.getElementById('officerGps').value = coords;
                const dispDiv = document.getElementById('officerGpsDisplay');
                if (dispDiv) {
                    dispDiv.innerHTML =
                        '<i class="fas fa-check-circle" style="color:#28c76f;"></i> พิกัดปัจจุบัน: ' + coords +
                        ' (ความแม่นยำ: ±' + Math.round(pos.coords.accuracy) + ' ม.)';
                    dispDiv.style.display = 'block';
                }
                Swal.fire({ icon: 'success', title: 'บันทึกพิกัดแล้ว', text: coords, timer: 1500,
                    showConfirmButton: false });
            },
            function(err) {
                hideLoading();
                Swal.fire('ผิดพลาด', 'ไม่สามารถระบุพิกัดได้: ' + err.message, 'error');
            }, { enableHighAccuracy: true, timeout: 15000 }
        );
    }

    async function officerSubmitTracking() {
        const village = document.getElementById('officerVillage').value;
        const visitDate = document.getElementById('officerVisitDate').value;
        const vaccine = document.getElementById('officerVaccine').value;
        const status = document.getElementById('officerStatus').value;
        const remarks = document.getElementById('officerRemarks').value;
        let gps = document.getElementById('officerGps').value;

        if (!village) {
            Swal.fire('แจ้งเตือน', 'กรุณาเลือกหมู่ที่', 'warning');
            return;
        }
        if (!APP.officerCurrentChild) {
            Swal.fire('แจ้งเตือน', 'กรุณาค้นหาและเลือกเด็กก่อนบันทึก', 'warning');
            return;
        }
        if (!status) {
            Swal.fire('แจ้งเตือน', 'กรุณาเลือกสถานะการติดตาม', 'warning');
            return;
        }
        if (!vaccine) {
            Swal.fire('แจ้งเตือน', 'กรุณาเลือกวัคซีน', 'warning');
            return;
        }

        if (!gps && APP.officerCurrentChild.gps) {
            gps = APP.officerCurrentChild.gps;
        }

        const fileData = [];
        for (let i = 0; i < APP.officerSelectedFiles.length; i++) {
            const f = APP.officerSelectedFiles[i];
            const b64 = await new Promise(function(resolve) {
                const r = new FileReader();
                r.onload = function(e) { resolve(e.target.result.split(',')[1]); };
                r.readAsDataURL(f);
            });
            fileData.push({ name: f.name, type: f.type, data: b64 });
        }

        const trackingData = {
            reporter: APP.currentUser.username,
            village: village,
            childName: APP.officerCurrentChild.fullname,
            childId: APP.officerCurrentChild.id,
            gps: gps,
            vaccine: vaccine,
            status: status,
            visitDate: visitDate,
            remarks: remarks,
            newApptDate: ''
        };

        showLoading('กำลังบันทึกข้อมูล...');
        try {
            const result = await callGAS('saveTrackingReport', [trackingData, fileData]);
            hideLoading();
            if (result.success) {
                Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ', text: result.message, timer: 2000,
                    showConfirmButton: false });
                officerResetForm();
            } else {
                Swal.fire('ผิดพลาด', result.message, 'error');
            }
        } catch (e) {
            hideLoading();
            Swal.fire('ผิดพลาด', e.message, 'error');
        }
    }

    async function submitTracking() {
        const village = document.getElementById('tr_village').value;
        const childName = document.getElementById('tr_search').value.trim();
        const childInfo = document.getElementById('tr_childInfo');
        const gps = document.getElementById('tr_gps').value;
        const vaccine = document.getElementById('tr_vaccine').value;
        const status = document.getElementById('tr_status').value;

        if (!village || !childName || !status) return Swal.fire('แจ้งเตือน',
            'กรุณากรอกข้อมูลให้ครบ (หมู่ที่, ชื่อเด็ก, สถานะ)', 'warning');
        if (!childInfo || childInfo.style.display === 'none') return Swal.fire('แจ้งเตือน',
            'กรุณาค้นหาและยืนยันข้อมูลเด็กก่อน', 'warning');

        const fileData = [];
        for (let i = 0; i < APP.selectedFiles.length; i++) {
            const f = APP.selectedFiles[i];
            const b64 = await new Promise(function(resolve) {
                const r = new FileReader();
                r.onload = function(e) { resolve(e.target.result.split(',')[1]); };
                r.readAsDataURL(f);
            });
            fileData.push({ name: f.name, type: f.type, data: b64 });
        }

        const trackingData = {
            reporter: APP.currentUser.username,
            village: village,
            childName: childName,
            gps: gps,
            vaccine: vaccine,
            status: status
        };

        showLoading('กำลังบันทึก...');
        try {
            const result = await callGAS('saveTrackingReport', [trackingData, fileData]);
            hideLoading();
            if (result.success) {
                Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ', text: result.message, timer: 1800,
                    showConfirmButton: false });
                resetTracking();
            } else Swal.fire('ผิดพลาด', result.message, 'error');
        } catch (e) { hideLoading();
            Swal.fire('ผิดพลาด', e.message, 'error'); }
    }

    function resetTracking() {
        const ids = ['tr_search', 'tr_gps'];
        ids.forEach(function(id) { const el = document.getElementById(id); if (el) el.value = ''; });
        const selects = ['tr_vaccine', 'tr_status'];
        selects.forEach(function(id) { const el = document.getElementById(id); if (el) el.value = ''; });
        const info = document.getElementById('tr_childInfo');
        if (info) info.style.display = 'none';
        const gpsDisp = document.getElementById('tr_gpsDisplay');
        if (gpsDisp) gpsDisp.style.display = 'none';
        const fileInp = document.getElementById('tr_files');
        if (fileInp) fileInp.value = '';
        const fileList = document.getElementById('tr_fileList');
        if (fileList) fileList.innerHTML = '';
        APP.selectedFiles = [];
    }

    async function doLoadReport() {
        showLoading('กำลังดึงข้อมูลรายงาน...');

        const filters = {
            hcode: (document.getElementById('rptFacility') || {}).value || 'ทั้งหมด',
            dateFrom: (document.getElementById('rptDateFrom') || {}).value || '',
            dateTo: (document.getElementById('rptDateTo') || {}).value || '',
            village: (document.getElementById('rptVillage') || {}).value || 'ทั้งหมด',
            status: (document.getElementById('rptStatus') || {}).value || 'ทั้งหมด',
            vaccine: (document.getElementById('rptVaccine') || {}).value || 'ทั้งหมด',
            reporter: (document.getElementById('rptReporter') || {}).value || 'ทั้งหมด',
            search: (document.getElementById('rptSearch') || {}).value || '',
            userRole: APP.currentUser.role,      
            userHcode: APP.currentUser.hcode,     
            userSubdistrict: APP.currentUser.subdistrict 
        };

        if (APP.currentUser.role === 'เจ้าหน้าที่' && APP.currentUser.village && APP.currentUser.village !== '-') {
            filters.village = APP.currentUser.village;
        }

        try {
            const result = await callGAS('getTrackingReport', [filters]);
            hideLoading();

            if (!result.success) {
                Swal.fire('ผิดพลาด', result.message || 'ไม่สามารถโหลดรายงานได้', 'error');
                return;
            }

            APP.rptAllRecords = result.records || [];
            APP.rptHeaders = result.headers || ['Timestamp', 'Reporter', 'Village', 'ChildName', 'GPS', 'Vaccine', 'Status', 'Files'];
            const sm = result.summary || {};

            renderRptSummary(sm);
            renderRptCharts(sm);
            renderRptTable(APP.rptAllRecords, sm.total || 0);

        } catch (err) {
            hideLoading();
            Swal.fire('ผิดพลาด', err.message, 'error');
        }
    }

    function renderRptSummary(sm) {
        const el = document.getElementById('rptSummaryStrip');
        if (!el) return;

        function sumCard(cls, icon, label, num, pct) {
            return '<div class="rpt-sum-card ' + cls + '">' +
                '<div class="rpt-sum-label"><i class="' + icon + '"></i> ' + label + '</div>' +
                '<div class="rpt-sum-num">' + num + '</div>' +
                (pct !== undefined ? '<div class="rpt-sum-pct">' + pct + '%</div>' : '') +
                '</div>';
        }

        el.innerHTML =
            sumCard('c-total', 'fas fa-list-ol', 'รายการทั้งหมด', sm.total || 0) +
            sumCard('c-ontime', 'fas fa-check-circle', 'มาตามนัด', sm.onTime || 0, sm.onTimeRate || 0) +
            sumCard('c-missed', 'fas fa-exclamation-circle', 'ขาดนัด', sm.missed || 0, sm.missedRate || 0) +
            sumCard('c-refused', 'fas fa-times-circle', 'ปฏิเสธวัคซีน', sm.refused || 0, sm.refusedRate || 0) +
            sumCard('c-other', 'fas fa-question-circle', 'อื่นๆ/ไม่ระบุ', sm.other || 0);
    }

    function exportRptCsv() {
        if (!APP.rptAllRecords || APP.rptAllRecords.length === 0) {
            return Swal.fire('แจ้งเตือน', 'ไม่มีข้อมูลสำหรับ export', 'info');
        }

        const rows = [];
        rows.push([
            'ลำดับ',
            APP.rptHeaders[0] || 'Timestamp',
            APP.rptHeaders[1] || 'Reporter',
            APP.rptHeaders[2] || 'Village',
            APP.rptHeaders[3] || 'ChildName',
            APP.rptHeaders[5] || 'Vaccine',
            APP.rptHeaders[6] || 'Status',
            APP.rptHeaders[4] || 'GPS',
            APP.rptHeaders[7] || 'Files'
        ]);

        APP.rptAllRecords.forEach(function(r, i) {
            rows.push([
                i + 1,
                formatDateTime(r.timestamp),
                r.reporter,
                r.village,
                r.childName,
                r.vaccine || '',
                r.status || '',
                r.gps || '',
                r.files || ''
            ]);
        });

        const csv = rows.map(function(row) {
            return row.map(function(cell) {
                const s = String(cell || '').replace(/"/g, '""');
                return (s.includes(',') || s.includes('"') || s.includes('\n')) ? '"' + s + '"' : s;
            }).join(',');
        }).join('\r\n');

        const bom = '\uFEFF';
        const blob = new Blob([bom + csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'VCC_tracking_report_' + new Date().toISOString().slice(0, 10) + '.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    // --- 1. ฟังก์ชันตัวกลางสำหรับสร้าง UI รายชื่อไฟล์ ---
    function renderModernFileList(files, listElementId, removeFuncName) {
        const fileList = document.getElementById(listElementId);
        if (!files || !files.length) {
            fileList.style.display = 'none';
            return;
        }

        fileList.style.display = 'block';
        fileList.innerHTML = Array.from(files).map(function(f, i) {
            const size = (f.size / 1024).toFixed(1) + ' KB';
            const isExcel = f.name.match(/\.(xls|xlsx)$/i);
            const isCsv = f.name.match(/\.csv$/i);
            
            const icon = isExcel ? 'fa-file-excel' : (isCsv ? 'fa-file-csv' : 'fa-file');
            const color = isExcel ? '#28c76f' : (isCsv ? '#17a2b8' : '#667eea');
            
            return '<div class="file-item-modern">' +
                '<div class="file-info">' +
                '<div class="file-icon" style="color:' + color + ';"><i class="fas ' + icon + '"></i></div>' +
                '<div><div class="file-name">' + esc(f.name) + '</div>' +
                '<div class="file-size">' + size + '</div></div>' +
                '</div>' +
                '<button class="btn-remove" onclick="' + removeFuncName + '(' + i + ')" title="ลบไฟล์"><i class="fas fa-times"></i></button>' +
                '</div>';
        }).join('');
    }

    // --- 2. ฟังก์ชันตัวกลางสำหรับลบไฟล์ออกจาก Input ---
    function removeModernFile(index, inputId, renderFunc) {
        const fileInput = document.getElementById(inputId);
        if (fileInput && fileInput.files) {
            const dt = new DataTransfer();
            const files = Array.from(fileInput.files);
            
            files.splice(index, 1); // ลบไฟล์ตาม index
            files.forEach(f => dt.items.add(f)); // นำไฟล์ที่เหลือใส่กลับเข้าไป
            
            fileInput.files = dt.files;
            renderFunc(dt.files); // อัปเดต UI
        }
    }

    // --- 3. ฟังก์ชันหลักที่ผูกกับเหตุการณ์ (Event) ของฝั่ง Data ---
    function handleDataFiles(files) {
        renderModernFileList(files, 'dataFileList', 'removeDataFile');
    }

    function removeDataFile(index) {
        removeModernFile(index, 'dataFileInput', handleDataFiles);
    }

    // --- 4. ฟังก์ชันหลักที่ผูกกับเหตุการณ์ (Event) ของฝั่ง Appointment ---
    function handleApptFiles(files) {
        renderModernFileList(files, 'apptFileList', 'removeApptFile');
    }

    function removeApptFile(index) {
        removeModernFile(index, 'apptFileInput', handleApptFiles);
    }

    // ============================================================
    // PULL TO REFRESH (MOBILE TOUCH EVENTS)
    // ============================================================
    let ptrStartY = 0;
    let ptrCurrentY = 0;
    let ptrIsPulling = false;
    
    const ptrEl = document.getElementById('ptr');

    // เริ่มจับการสัมผัสหน้าจอ
    document.addEventListener('touchstart', function(e) {
        // อนุญาตให้ดึงรีเฟรชได้เฉพาะตอนที่หน้าจออยู่บนสุดเท่านั้น
        if (window.scrollY === 0) {
            ptrStartY = e.touches[0].clientY;
            ptrIsPulling = true;
        }
    }, { passive: true });

    // ระหว่างลากนิ้ว
    document.addEventListener('touchmove', function(e) {
        if (!ptrIsPulling || !ptrEl) return;
        
        ptrCurrentY = e.touches[0].clientY;
        const distance = ptrCurrentY - ptrStartY;

        // ตรวจสอบว่าเป็นการดึงลง
        if (distance > 0 && window.scrollY === 0) {
            ptrEl.classList.add('visible');
            const icon = ptrEl.querySelector('.ptr-icon i');
            const text = ptrEl.querySelector('.ptr-text');
            
            // หากดึงเกิน 60px จะแสดงสถานะว่าปล่อยนิ้วได้เลย
            if (distance > 60) {
                ptrEl.classList.add('release');
                if(text) text.textContent = 'ปล่อยเพื่อรีเฟรช';
                if(icon) icon.className = 'fas fa-arrow-up';
            } else {
                ptrEl.classList.remove('release');
                if(text) text.textContent = 'ดึงลงเพื่อรีเฟรช';
                if(icon) icon.className = 'fas fa-arrow-down';
            }
        }
    }, { passive: true });

    // เมื่อปล่อยนิ้วออกจากจอ
    document.addEventListener('touchend', function(e) {
        if (!ptrIsPulling || !ptrEl) return;
        ptrIsPulling = false;
        
        const distance = ptrCurrentY - ptrStartY;
        
        if (distance > 60 && window.scrollY === 0) {
            // ดึงลงถึงระยะที่กำหนด เปลี่ยนสถานะเป็น Loading
            ptrEl.classList.add('loading');
            const icon = ptrEl.querySelector('.ptr-icon i');
            const text = ptrEl.querySelector('.ptr-text');
            if(icon) icon.className = 'fas fa-spinner';
            if(text) text.textContent = 'กำลังโหลดข้อมูล...';
            
            // โหลดหน้าปัจจุบันใหม่ (เสมือนการ Refresh Data)
            if (APP.currentPage) {
                navigateTo(APP.currentPage);
            }
            
            // ซ่อนแถบหลังจากผ่านไป 1 วินาที เพื่อให้แอนิเมชันดูสมูท
            setTimeout(function() {
                ptrEl.classList.remove('visible', 'release', 'loading');
            }, 1000);
        } else {
            // ถ้าดึงลงไม่ถึงระยะ ให้ยกเลิกและซ่อนกลับไป
            ptrEl.classList.remove('visible', 'release');
        }
        
        // รีเซ็ตค่า
        ptrStartY = 0;
        ptrCurrentY = 0;
    });

                    <button onclick="applyTheme('#00cfe8', '#0284c7')" style="width: 45px; height: 45px; border-radius: 50%; border: 3px solid #fff; background: linear-gradient(135deg, #00cfe8, #0284c7); cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.15); transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'"></button>
                    <button onclick="applyTheme('#ff9f43', '#ea5455')" style="width: 45px; height: 45px; border-radius: 50%; border: 3px solid #fff; background: linear-gradient(135deg, #ff9f43, #ea5455); cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.15); transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'"></button>
                    <button onclick="applyTheme('#ec4899', '#be185d')" style="width: 45px; height: 45px; border-radius: 50%; border: 3px solid #fff; background: linear-gradient(135deg, #ec4899, #be185d); cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.15); transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'"></button>
                    <button onclick="applyTheme('#475569', '#1e293b')" style="width: 45px; height: 45px; border-radius: 50%; border: 3px solid #fff; background: linear-gradient(135deg, #475569, #1e293b); cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.15); transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'"></button>
                </div>
                <div style="margin-top: 15px; font-size: 13px; color: #888;">ระบบจะจดจำสีที่คุณเลือกไว้สำหรับอุปกรณ์นี้</div>
            `,
            showConfirmButton: false,
            showCloseButton: true
        });
    };

    // ใช้สีธีมและเขียนทับ CSS
    window.applyTheme = function(color1, color2) {
        // บันทึกลง Storage
        localStorage.setItem('vcc_theme_c1', color1);
        localStorage.setItem('vcc_theme_c2', color2);
        
        let styleEl = document.getElementById('dynamic-theme');
        if (!styleEl) {
            styleEl = document.createElement('style');
            styleEl.id = 'dynamic-theme';
            document.head.appendChild(styleEl);
        }
        
        // สร้างชุดคำสั่ง CSS เพื่อเขียนทับ (Override) สีหลัก
        styleEl.innerHTML = `
            /* Background Gradients */
            .login-page::before, 
            .login-header .icon-wrapper, 
            .btn-login, 
            .user-avatar, 
            .modern-modal .modal-header h3 .icon-wrapper, 
            .modern-modal .modal-footer .btn-import {
                background: linear-gradient(135deg, ${color1} 0%, ${color2} 100%) !important;
            }
            
            /* Topbar สำหรับ Mobile */
            @media (max-width: 768px) {
                .top-bar { background: linear-gradient(135deg, ${color1} 0%, ${color2} 100%) !important; }
            }
            
            /* Text & Borders */
            .menu-item:hover, .menu-item.active {
                border-left-color: ${color1} !important;
                background: ${color1}25 !important;
            }
            
            .page-title i, 
            .stat-icon.blue, 
            .chart-card h4 i, 
            .map-container h4 i, 
            .tracking-card h3 i, 
            .rpt-table-title i,
            .rpt-filter-card h4 i,
            .pull-to-refresh {
                color: ${color1} !important;
            }
            
            /* Action Buttons */
            .btn-search-child, .btn-filter, .btn-rpt-search, .btn-submit, .rpt-count-tag, .rpt-mini-bar {
                background: ${color1} !important;
            }
            .btn-search-child:hover, .btn-filter:hover, .btn-rpt-search:hover, .btn-submit:hover {
                background: ${color2} !important;
            }
            
            /* Mobile Bottom Nav */
            .bottom-nav-item.active { color: ${color1} !important; }
            .bottom-nav-item.active i {
                background: ${color1}25 !important;
                color: ${color1} !important;
            }
            
            /* Form Inputs Outline */
            .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
                border-color: ${color1} !important;
                box-shadow: 0 0 0 3px ${color1}20 !important;
            }
            .login-body .form-group input:focus + i { color: ${color1} !important; }
            .btn-register:hover { border-color: ${color1} !important; color: ${color1} !important; }
            
            /* Info Box & Upload Area */
            .modern-modal .info-box::before { background: linear-gradient(90deg, ${color1}, ${color2}) !important; }
            .modern-modal .upload-area:hover { border-color: ${color1} !important; box-shadow: 0 8px 25px ${color1}15 !important; }
            .modern-modal .upload-area.dragover { border-color: ${color1} !important; background: ${color1}10 !important; }
            
            /* SweetAlert2 Confirm Button Override */
            .swal2-confirm { background-color: ${color1} !important; }
        `;
        
        // ปิด Modal (ถ้าเปิดอยู่)
        if (Swal.isVisible()) Swal.close();
    };

    // สั่งให้รันฟังก์ชันโหลดสีทันที
    loadSavedTheme();
    window.cascadeVillageOptions = function(hcode, targetDropdownId) {
        const vilSelect = document.getElementById(targetDropdownId);
        if (!vilSelect) return;
        
        // กรองข้อมูลหมู่บ้านจาก Cache ที่โหลดมาเก็บไว้
        let filtered = APP.villagesCache || [];
        if (hcode && hcode !== 'ทั้งหมด') {
            filtered = filtered.filter(v => v.hcode === hcode);
        }
        
        let html = '<option value="ทั้งหมด">-- ทั้งหมด --</option>';
        html += filtered.map(v => `<option value="${esc(v.name)}">${esc(v.name)}</option>`).join('');
        
        vilSelect.innerHTML = html;
    };
    // ============================================================
    // AUTO LOGOUT (30 MINUTES INACTIVITY)
    // ============================================================
    let inactivityTimer;
    const INACTIVITY_LIMIT = 30 * 60 * 1000; // 30 นาที (หน่วยเป็นมิลลิวินาที)

    function resetInactivityTimer() {
        // ล้างเวลาเก่าทิ้ง
        clearTimeout(inactivityTimer);
        
        // ถ้าระบบไม่ได้ล็อกอินอยู่ (อยู่หน้าล็อกอิน) ไม่ต้องจับเวลา
        if (!APP || !APP.currentUser) return;

        // เริ่มจับเวลาใหม่
        inactivityTimer = setTimeout(function() {
            // แจ้งเตือนผู้ใช้เมื่อหมดเวลา
            Swal.fire({
                icon: 'warning',
                title: 'หมดเวลาเซสชัน',
                text: 'ระบบได้ทำการล็อกเอาท์อัตโนมัติเนื่องจากไม่มีการใช้งานเกิน 30 นาที เพื่อความปลอดภัย',
                confirmButtonText: 'ตกลง',
                confirmButtonColor: '#667eea',
                allowOutsideClick: false,
                allowEscapeKey: false
            }).then(() => {
                logout(); // เรียกใช้ฟังก์ชัน logout เดิมของระบบเพื่อลบ session และกลับไปหน้าล็อกอิน
            });
        }, INACTIVITY_LIMIT);
    }

    // รายการเหตุการณ์ (Events) ที่ถือว่าผู้ใช้ยังใช้งานหน้าเว็บอยู่
    const activityEvents = [
        'mousemove', 'mousedown', 'keypress', 'DOMMouseScroll', 
        'mousewheel', 'touchmove', 'MSPointerMove', 'scroll', 'click'
    ];
    
    // ผูก Event Listener เข้ากับเอกสารทั้งหมด
    activityEvents.forEach(function(eventName) {
        document.addEventListener(eventName, resetInactivityTimer, true);
    });

    // ============================================================
    // ACTION BUTTONS & STATUS CHANGE
    // ============================================================

    // 1. ฟังก์ชันสำหรับเชื่อมปุ่มรูปตา (ดูรายละเอียด) ให้ทำงาน
    window.viewChild = window.viewChildFromMap;

    // 2. ฟังก์ชันสำหรับเปลี่ยนสถานะเด็กจาก Dropdown ในตาราง
    window.changeStatus = async function(childName, selectEl) {
        const newStatus = selectEl.value;
        const childId = selectEl.getAttribute('data-childid') || '';
        
        // ถ้าเลือกตัวเลือกว่างๆ ให้ข้ามไป
        if (!newStatus) return;

        const r = await Swal.fire({
            title: 'ยืนยันเปลี่ยนสถานะ',
            text: `ต้องการเปลี่ยนสถานะของ "${childName}" เป็น "${newStatus}" ใช่หรือไม่?`,
            icon: 'question',
            showCancelButton: true,
            confirmButtonColor: '#28c76f',
            confirmButtonText: 'ยืนยัน',
            cancelButtonText: 'ยกเลิก'
        });

        // ถ้าผู้ใช้กดยกเลิก ให้รีเซ็ตค่า Dropdown กลับเป็นค่าว่าง
        if (!r.isConfirmed) {
            selectEl.value = ""; 
            return;
        }

        showLoading('กำลังอัปเดตสถานะ...');
        try {
            // ดึงชื่อผู้ใช้ปัจจุบันเพื่อส่งไปเก็บบันทึกว่าใครเป็นคนเปลี่ยนสถานะ
            const reporter = APP.currentUser.username;
            
            // ส่งข้อมูลไปอัปเดตที่ฝั่ง Backend (code.gs)
            const res = await callGAS('updateChildStatus', [childName, newStatus, reporter, '', childId]);
            hideLoading();
            
            if (res.success) {
                Swal.fire({ icon: 'success', title: 'อัปเดตสถานะสำเร็จ', timer: 1500, showConfirmButton: false });
                
                // รีเฟรชตารางตามหน้าเว็บที่เปิดอยู่ปัจจุบัน เพื่อให้แสดงผลสถานะใหม่
                if (APP.currentPage === 'children') {
                    if (typeof doChildSearch === 'function') doChildSearch();
                } else if (APP.currentPage === 'missing') {
                    if (typeof doMissingSearch === 'function') doMissingSearch();
                }
            } else {
                Swal.fire('ผิดพลาด', res.message, 'error');
                selectEl.value = "";
            }
        } catch (e) {
            hideLoading();
            Swal.fire('ผิดพลาด', e.message, 'error');
            selectEl.value = "";
        }
    };
    console.log('✅ ระบบติดตามวัคซีนเด็ก 0-5 ปี พร้อมทำงาน');
</script>
